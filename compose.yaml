services:
  app:
    build: .
    container_name: direct-campaign-manager
    restart: unless-stopped
    # CMD now runs under xvfb-run (Ozon-режим массового запуска, см.
    # Dockerfile) — its readiness handshake signals its own PID 1 via
    # SIGUSR1, which the kernel silently drops for a PID-1 process with no
    # real init (classic Docker gotcha). init:true gives the container a
    # real PID 1 (tini) so that signal actually reaches the shell script —
    # without it, xvfb-run hangs forever with zero log output, confirmed
    # by testing locally (works instantly with --init, hangs without it).
    init: true
    env_file:
      - .env
    # The ParsYa pool API is only reachable via the host's own 127.0.0.1
    # (a reverse SSH tunnel bound to loopback, deliberately not exposed on
    # any other interface) — host.docker.internal/extra_hosts can't reach a
    # loopback-only service through the bridge network, so share the host's
    # network namespace directly instead. The app itself now binds to
    # 127.0.0.1 inside the container (see Dockerfile), so this doesn't widen
    # its own exposure despite dropping the port-mapping's IP restriction.
    network_mode: host
    volumes:
      - ./data:/app/data
