# Nginx site config for реклама.союзюристовроссии.рф
# IDN written in ASCII/Punycode for compatibility.
# Install first as /etc/nginx/sites-available/reklama.soyuzuristov.conf
# Certbot --nginx will add the HTTPS listener after the HTTP site is verified.

server {
    listen 80;
    listen [::]:80;

    server_name xn--80aanufhx.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai;

    client_max_body_size 10m;

    access_log /var/log/nginx/reklama-access.log;
    error_log  /var/log/nginx/reklama-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
