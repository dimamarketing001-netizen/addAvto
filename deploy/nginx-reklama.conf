# Nginx site config for реклама.союзюристовроссии.рф
# IDN written in ASCII/Punycode for compatibility.
# Install first as /etc/nginx/sites-available/reklama.soyuzuristov.conf
# Certbot --nginx will add the HTTPS listener after the HTTP site is verified.

server {
    # Bind the exact public IPv4 address used by ISPmanager virtual hosts.

    server_name xn--80aanufhx.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai;

    client_max_body_size 10m;

    access_log /var/log/nginx/reklama-access.log;
    error_log  /var/log/nginx/reklama-error.log warn;

    # Bulk campaign generation drives real Selenium account provisioning
    # (one Chrome session per new account, run in series) plus several
    # Direct API calls per campaign — easily minutes per account, way past
    # the 60s default below. Match this location before the general one.
    location ~ ^/api/projects/\d+/campaigns/bulk-create$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2026-11-03: панель ParsYa Control Plane ("Парсер"), отдельная вкладка
    # в сайдбаре ЛК — отдельное приложение (127.0.0.1:8091, туннелируется
    # из WSL через parsya-tunnel.service), со своим собственным логином/
    # паролем (не Basic Auth этого домена). X-Forwarded-Prefix говорит
    # приложению добавлять /parser к своим собственным абсолютным ссылкам
    # и редиректам — без этого заголовка оно продолжает работать как
    # раньше на своём родном домене (парсер.союзюристовроссии.рф).
    location = /parser {
        return 301 /parser/;
    }
    location /parser/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /parser;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 62.109.6.186:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xn--80aanufhx.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xn--80aanufhx.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = xn--80aanufhx.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 62.109.6.186:80;

    server_name xn--80aanufhx.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai;
    return 404; # managed by Certbot


}